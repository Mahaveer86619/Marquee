# Marquee local stack. Start it with `marquee up` (or `docker compose -f deploy/compose.yaml up -d`).
# Only the core API is published, and only on the loopback interface.

name: marquee

x-python-health: &python-health
  interval: 15s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  core:
    build:
      context: ..
      dockerfile: deploy/docker/core.Dockerfile
    image: marquee/core:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    # API keys, created by the user from deploy/.env.example. Optional.
    env_file:
      - path: .env
        required: false
    environment:
      MARQUEE_CORE_ADDR: ":7700"
      MARQUEE_DATA_DIR: /data
      MARQUEE_CACHE_DIR: /cache
      MARQUEE_CONFIG_FILE: /marquee/config.json
      MARQUEE_LIBRARY_DIR: /library
      MARQUEE_DOWNLOADS_DIR: /downloads
      MARQUEE_AUDIOLAB_URL: http://audiolab:7710
      MARQUEE_RECS_URL: http://recs:7720
    volumes:
      # SQLite databases and in-progress torrent data stay on Docker volumes;
      # Windows bind mounts are too slow and unreliable for them.
      - marquee-data:/data
      - marquee-cache:/cache
      - marquee-downloads:/downloads
      # Host data folder (config.json) and library, set by the launcher from
      # config.json. Defaults apply when docker compose is run directly.
      - ${MARQUEE_HOME:-../.marquee}:/marquee:ro
      - ${MARQUEE_LIBRARY_DIR:-../.marquee/library}:/library
    healthcheck:
      test: ["CMD", "/usr/local/bin/marquee-core", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  audiolab:
    build:
      context: ..
      dockerfile: deploy/docker/audiolab.Dockerfile
    image: marquee/audiolab:dev
    restart: unless-stopped
    volumes:
      - marquee-cache:/cache
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7710/healthz', timeout=2)"]

  recs:
    build:
      context: ..
      dockerfile: deploy/docker/recs.Dockerfile
    image: marquee/recs:dev
    restart: unless-stopped
    volumes:
      - marquee-recs:/data
    healthcheck:
      <<: *python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7720/healthz', timeout=2)"]

  # Optional indexer manager. Enable with `marquee setup -with-indexers`
  # (or COMPOSE_PROFILES=indexers). Marquee ships no indexer configuration.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    profiles: ["indexers"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9696:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - marquee-prowlarr:/config

volumes:
  marquee-data:
  marquee-cache:
  marquee-downloads:
  marquee-recs:
  marquee-prowlarr:
